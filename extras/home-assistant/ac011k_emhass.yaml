# Home Assistant package for AC011K / WARP More / EMHASS.
#
# Contract: EMHASS (or another PV controller) writes its desired charger power
# in watts to input_number.ac011k_emhass_target_power. This package translates
# that value into a phase request and a current limit. The wallbox firmware is
# responsible for the safety-critical stop/contactors-off/switch/resume sequence.

input_boolean:
  ac011k_emhass_control:
    name: AC011K EMHASS-Regelung
    icon: mdi:solar-power-variant

input_number:
  ac011k_emhass_target_power:
    name: AC011K EMHASS Sollleistung
    min: 0
    max: 11000
    step: 100
    unit_of_measurement: W
    mode: box
    icon: mdi:ev-station

mqtt:
  sensor:
    - name: AC011K aktive Phasen EMHASS
      unique_id: ac011k_active_phases_emhass
      state_topic: "AC011K/10052204010908/evse/phase_switch"
      value_template: "{{ value_json.active_phases }}"
      icon: mdi:transmission-tower

    - name: AC011K angeforderte Phasen EMHASS
      unique_id: ac011k_requested_phases_emhass
      state_topic: "AC011K/10052204010908/evse/phase_switch"
      value_template: "{{ value_json.requested_phases }}"
      icon: mdi:sine-wave

  binary_sensor:
    - name: AC011K Phasenumschaltung EMHASS
      unique_id: ac011k_phase_switching_emhass
      state_topic: "AC011K/10052204010908/evse/phase_switch"
      value_template: "{{ value_json.switching }}"
      payload_on: "True"
      payload_off: "False"
      icon: mdi:swap-horizontal

automation:
  - id: ac011k_emhass_select_three_phases
    alias: AC011K EMHASS auf drei Phasen wechseln
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {{ is_state('input_boolean.ac011k_emhass_control', 'on')
             and states('input_number.ac011k_emhass_target_power') | float(0) >= 4500
             and states('sensor.ac011k_angeforderte_phasen_emhass') | int(0) != 3
             and is_state('binary_sensor.ac011k_phasenumschaltung_emhass', 'off') }}
        for: "00:05:00"
    actions:
      - action: mqtt.publish
        data:
          topic: "AC011K/10052204010908/evse/phase_switch_update"
          payload: '{"phases":3}'
          qos: 1
          retain: false

  - id: ac011k_emhass_select_one_phase
    alias: AC011K EMHASS auf eine Phase wechseln
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {{ is_state('input_boolean.ac011k_emhass_control', 'on')
             and states('input_number.ac011k_emhass_target_power') | float(0) <= 3500
             and states('sensor.ac011k_angeforderte_phasen_emhass') | int(0) != 1
             and is_state('binary_sensor.ac011k_phasenumschaltung_emhass', 'off') }}
        for: "00:10:00"
    actions:
      - action: mqtt.publish
        data:
          topic: "AC011K/10052204010908/evse/phase_switch_update"
          payload: '{"phases":1}'
          qos: 1
          retain: false

  - id: ac011k_emhass_apply_current
    alias: AC011K EMHASS Ladestrom anwenden
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - input_number.ac011k_emhass_target_power
          - sensor.ac011k_aktive_phasen_emhass
          - input_boolean.ac011k_emhass_control
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.ac011k_emhass_control
        state: "on"
      - condition: template
        value_template: >-
          {{ states('sensor.ac011k_aktive_phasen_emhass') | int(0) in [1, 3] }}
    variables:
      target_w: "{{ states('input_number.ac011k_emhass_target_power') | float(0) }}"
      phases: "{{ states('sensor.ac011k_aktive_phasen_emhass') | int(1) }}"
      minimum_w: "{{ 230 * phases * 6 }}"
      calculated_ma: "{{ (target_w * 1000 / (230 * phases)) | int(0) }}"
      current_ma: >-
        {% if target_w < minimum_w %}
          0
        {% else %}
          {{ [[calculated_ma, 6000] | max, 16000] | min }}
        {% endif %}
    actions:
      - delay: "00:00:02"
      - action: mqtt.publish
        data:
          topic: "AC011K/10052204010908/evse/external_current_update"
          payload: >-
            {"current":{{ current_ma | int(0) }}}
          qos: 1
          retain: false
